<!DOCTYPE html>
<!-- Ejemplo: pruebas de etiquetas img para la práctica -->
<html>
<head>
<title>Pruebas de IMG</title>
</head>
<body>
<h1>Pruebas de etiquetas &lt;img&gt;</h1>

<p>1) Imagen con comillas dobles:</p>
<img src="images/photo.jpg" alt="Foto de prueba" width="300">

<p>2) Imagen con comillas simples:</p>
<img src='images/logo.bmp' alt='Logo Universidad'>

<p>3) Imagen con src sin comillas:</p>
<img src=images/icon.gif alt="Icono">

<p>4) Imagen sin atributo alt:</p>
<img src="images/noalt.svg">

<p>5) Imagen con query string en src:</p>
<img src="images/pic.PNG?size=200" alt="Mayúsculas">

<p>6) Imagen con punto en la ruta:</p>
<img src="/path.to.folder/name.jpeg" alt="Ruta con punto">

<p>7) Imagen multilínea (prueba de limitación):</p>
<img
src="images/multiline.jpg"
alt="Multilinea">

</body>
</html>
